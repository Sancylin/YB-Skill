name: YB V6 Playground

on:
  push:
    branches: [yb-v6-playground]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install dependencies
        working-directory: demo
        run: npm ci

      - name: Build demo for GitHub Pages
        working-directory: demo
        run: npx vite build --base=/YB-Skill/

      - name: Rewrite public asset roots for project Pages
        working-directory: demo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          roots = [
              "icons", "images", "img-viewer", "ipad",
              "loading", "previews"
          ]
          files = [
              "favicon.svg",
              "yuanbao-brand.svg",
          ]
          for path in Path("dist").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html",".js",".css"}:
                  continue
              text = path.read_text(encoding="utf-8")
              for root in roots:
                  text = text.replace(f"/{root}/", f"/YB-Skill/{root}/")
              for name in files:
                  text = text.replace(f"/{name}", f"/YB-Skill/{name}")
              path.write_text(text, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
