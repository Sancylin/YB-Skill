name: YB V6 Windows PowerShell 5.1 Parse

on:
  push:
    branches: [yb-v6-playground]

permissions:
  contents: read

jobs:
  ps51-parse:
    runs-on: windows-latest
    env:
      START_B64: 
    steps:
      - name: Parse start.ps1 with Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = Join-Path $env:TEMP 'yb-v6-start.ps1'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:START_B64))
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $version = $PSVersionTable.PSVersion.ToString()
          Write-Host "Windows PowerShell version: $version"
          Write-Host "PARSE PASS"
