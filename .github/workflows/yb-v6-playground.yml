name: YB V6 Offline Build Dependencies

on:
  push:
    branches: [yb-v6-playground]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json

      - name: Install demo dependencies
        working-directory: demo
        run: npm ci

      - name: Pack local build dependencies
        shell: bash
        run: tar -C demo -czf yb-preview-deps.tgz node_modules package.json package-lock.json

      - name: Upload build dependencies
        uses: actions/upload-artifact@v4
        with:
          name: yb-preview-deps
          path: yb-preview-deps.tgz
          compression-level: 0
          if-no-files-found: error
